<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>麻油羊肉 - 詳細介紹</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-2xl overflow-hidden">
        <img src="IMG_0035.jpeg" alt="麻油羊肉" class="w-full h-80 object-cover">
        
        <div class="p-8">
            <a href="ym.html" class="text-blue-500 mb-4 inline-block">← 回首頁</a>
            <h1 class="text-3xl font-bold text-gray-800 mb-6">麻油羊肉</h1>
          <section class="mb-8">
                <h2 class="text-xl font-semibold text-blue-700 border-b-2 border-blue-100 pb-2 mb-3">歷史故事</h2>
                <p class="text-gray-700 leading-relaxed">
                   麻油羊肉（或羊肉爐）在台灣是冬令進補的代表，其歷史可追溯至古代漢人食補文化，但羊肉早年因腥味重較少人吃；直到清代後期與日治時期，隨著養羊風氣和技術進步，尤其在岡山、溪湖等地，羊肉爐形式在1970年代後興盛，成為結合中原食補與在地特色的普及美食
                </p>
            </section>

            <section class="mb-8">
                <h2 class="text-xl font-semibold text-blue-700 border-b-2 border-blue-100 pb-2 mb-3">所需材料</h2>
                <ul class="list-disc list-inside text-gray-700 space-y-2">
                    <li><strong>主料：</strong>材料:羊肉、薑片、蔥。</li>
                    <li><strong>配料：</strong>麻油、醬油、二砂、中藥粉。</li>
                </ul>
            </section>

            <section class="mb-8">
                <h2 class="text-xl font-semibold text-blue-700 border-b-2 border-blue-100 pb-2 mb-3">料理方法</h2>
                <ol class="list-decimal list-inside text-gray-700 space-y-4">
                    <li><strong>先將麻油，跟薑片爆香</li>
                    <li><strong>加入羊肉炒至熟透></li>
                   <li><strong>再加入蔥拌炒一下即可裝盤即可</li>
                </ol>
            </section>
        </div>
    </div>
</body>
</html>
