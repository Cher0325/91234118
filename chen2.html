<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>當歸大骨湯 - 詳細介紹</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-2xl overflow-hidden">
        <img src="chen2.jpg" alt="當歸大骨湯" class="w-full h-80 object-cover">
        
        <div class="p-8">
            <a href="ym.html" class="text-blue-500 mb-4 inline-block">← 回首頁</a>
            <h1 class="text-3xl font-bold text-gray-800 mb-6">當歸大骨湯</h1>
          <section class="mb-8">
                <h2 class="text-xl font-semibold text-blue-700 border-b-2 border-blue-100 pb-2 mb-3">歷史故事</h2>
                <p class="text-gray-700 leading-relaxed">
                   當歸大骨湯是一道溫補養身的藥膳湯品，主要以羊大骨為主料，搭配當歸、紅棗、枸杞等中藥材，以及薑片、米酒等調味，透過汆燙去腥、冷水下鍋慢燉的方式，煮出湯頭溫潤、藥香四溢、補氣血的美味佳湯。此湯品適合手腳冰冷、氣血不足者，尤其女性生理不調時飲用，有補血活血、滋陰潤燥的功效。
                </p>
            </section>

            <section class="mb-8">
                <h2 class="text-xl font-semibold text-blue-700 border-b-2 border-blue-100 pb-2 mb-3">所需材料</h2>
                <ul class="list-disc list-inside text-gray-700 space-y-2">
                    <li><strong>主料：</strong>材料:當歸湯、薑絲、羊大骨。</li>
                    <li><strong>配料：</strong>當歸、熟地片、枸杞、人參、紅棗、中藥粉。</li>
                </ul>
            </section>

            <section class="mb-8">
                <h2 class="text-xl font-semibold text-blue-700 border-b-2 border-blue-100 pb-2 mb-3">料理方法</h2>
                <ol class="list-decimal list-inside text-gray-700 space-y-4">
                    <li><strong>先將當歸、熟地片、枸杞、人參、紅棗、中藥粉燉煮</li>
                    <li><strong>加入大骨等材料</li>
                   <li><strong>調味後幾可裝碗></strong>
                </ol>
            </section>
        </div>
    </div>
</body>
</html>
